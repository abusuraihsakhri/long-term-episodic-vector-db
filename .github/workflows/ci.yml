name: Tests and packaging

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api,test]' build
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Audit-chain regression test
        run: python -m pytest -q tests/test_long_term_episodic_vector_db.py -k audit_trail

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/app.mjs
      - name: Test browser vector logic
        run: node --test web/test-app.mjs
      - name: Verify Pages entry point
        run: |
          test -f index.html
          test -f web/index.html
          test -f web/app.mjs
