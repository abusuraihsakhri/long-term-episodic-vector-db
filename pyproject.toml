[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "long-term-episodic-vector-db"
version = "2.0.0"
description = "EpisodicVector-Store: Hierarchical HNSW & Cross-Session Memory Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
long-term-episodic-vector-db = "episodic_vector_store.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/long-term-episodic-vector-db"
Repository = "https://github.com/abusuraihsakhri/long-term-episodic-vector-db.git"
