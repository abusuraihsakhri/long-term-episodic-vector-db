[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "long-term-episodic-vector-db"
version = "2.0.0"
description = "EpisodicVector-Store: Hierarchical HNSW & Cross-Session Memory Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=8"]

[project.scripts]
long-term-episodic-vector-db = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/long-term-episodic-vector-db"
Repository = "https://github.com/abusuraihsakhri/long-term-episodic-vector-db.git"

[tool.setuptools]
packages = ["agents", "episodic_vector_store"]
py-modules = ["cli", "enrichment", "simulator"]
